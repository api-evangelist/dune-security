aid: dune-security
name: Dune Security
description: >-
  Dune Security is a cybersecurity company whose User Adaptive Risk Management
  platform uses AI-driven behavioral analysis to quantify and reduce user-layer
  cyber risk. It runs omni-channel attack simulations (email/spear phishing,
  smishing, vishing, deepfakes, and encrypted-app lures) tailored to each
  employee's role and behavior, generates a live User Risk Score from five inputs
  (business impact, simulations, training activity, external security
  integrations, and historical data), and automatically adapts micro-training and
  security controls in real time. The platform integrates with IAM, EDR, SEG,
  DLP, and HRIS systems to escalate or restrict access for high-risk users, and
  ships an in-house training library (Security Awareness, Compliance, and
  Functional-Specific Training) covering NIST 800-53, NIST CSF, HIPAA, PCI DSS,
  SOX, ISO 27001, FFIEC, GLBA, and GDPR. Dune Security is backed by Craft Ventures.
